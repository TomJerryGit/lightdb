<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>LightDB Studio Web</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="app">
  <!-- 登录页 -->
  <div id="login-page" class="page">
    <div class="login-box">
      <h1>🔌 LightDB Studio</h1>
      <p class="subtitle">Web 版数据库管理工具</p>

      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="login-user" value="admin">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="login-pass" value="admin123">
      </div>

      <button id="login-btn" class="btn-primary">登录</button>

      <div id="login-error" class="error-msg"></div>

      <div class="login-hint">
        <b>测试账号：</b><br>
        admin/admin123 · dev/dev123 · analyst/analyst123 · viewer/viewer123
      </div>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="main-page" class="page hidden">
    <header>
      <div class="logo">🔌 LightDB Studio</div>
      <div class="user-info">
        <span id="user-label"></span>
        <button id="logout-btn" class="btn-small">退出</button>
      </div>
    </header>

    <div class="layout">
      <!-- 左侧对象树 -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <select id="conn-select" class="conn-select">
            <option value="">选择连接...</option>
          </select>
          <button id="refresh-obj-btn" class="btn-small">🔄</button>
        </div>
        <div id="object-tree" class="tree"></div>
      </aside>

      <!-- 中间查询区 -->
      <main class="main-area">
        <div class="editor-area">
          <div class="toolbar">
            <button id="run-btn" class="btn-primary">▶ 执行 (Ctrl+Enter)</button>
            <button id="format-btn" class="btn-small">🎨 格式化</button>
            <button id="clear-btn" class="btn-small">清空</button>
            <span id="exec-status" class="status"></span>
          </div>
          <textarea id="sql-editor" placeholder="-- 输入 SQL
SELECT * FROM users LIMIT 100;" spellcheck="false"></textarea>
        </div>
        <div class="result-area">
          <div id="result-info" class="result-info">就绪</div>
          <div id="result-table" class="result-table"></div>
        </div>
      </main>

      <!-- 右侧历史 -->
      <aside class="right-panel">
        <h3>查询历史</h3>
        <div id="history-list" class="history-list"></div>
      </aside>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
