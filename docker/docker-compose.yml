version: '3.8'

# ============================================================
# LightDB 4.0 通用版 Docker Compose（数据库服务端 + Studio Web）
#
# 镜像: docker/Dockerfile（多模式：server / web / cli / check / bench / bash）
# 构建上下文: ..（仓库根目录）
# 启动: docker compose -f docker/docker-compose.yml up -d
# ============================================================

services:
  # LightDB 服务器（镜像默认 CMD = server）
  lightdb:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: lightdb/server:4.0.0
    container_name: lightdb-server
    # 入口脚本 docker/entrypoint.sh 解析 "server" -> python -m lightdb.main --mode single
    # 原 `command: python main.py` 已移除：仓库根目录没有 main.py。
    command: ["server"]
    ports:
      - "8888:8888"
    volumes:
      - lightdb-data:/app/data
      - lightdb-logs:/app/logs
      - ./config/config.json:/app/config.json:ro
    environment:
      - TZ=Asia/Shanghai
      - LIGHTDB_LOG_LEVEL=INFO
    # 数据库端口存活探测（镜像内健康检查亦探测 8888）
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; s=socket.create_connection(('127.0.0.1',8888),3); s.close()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - lightdb-net

  # LightDB Studio Web
  studio-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: lightdb/server:4.0.0
    container_name: lightdb-studio-web
    # 走 entrypoint 的 web 模式：会先等待 lightdb 就绪再启动 web.start
    command: ["web"]
    ports:
      - "8080:8080"
    volumes:
      - studio-config:/home/lightdb/.lightdb_studio
    environment:
      - TZ=Asia/Shanghai
      - LIGHTDB_HOST=lightdb
      - LIGHTDB_PORT=8888
      - WEB_PORT=8080
    depends_on:
      lightdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - lightdb-net

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: lightdb-prometheus
    ports:
      - "9090:9090"
    volumes:
      # docker/config/prometheus.yml 真实存在（含 lightdb:8888 与 studio-web:8080 抓取目标）
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - lightdb-net

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: lightdb-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - lightdb-net

volumes:
  lightdb-data:
  lightdb-logs:
  studio-config:
  prometheus-data:
  grafana-data:

networks:
  lightdb-net:
    driver: bridge
