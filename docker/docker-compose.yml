version: '3.8'

services:
  # LightDB 服务器
  lightdb:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: lightdb-server
    command: python main.py
    ports:
      - "8888:8888"
    volumes:
      - lightdb-data:/app/data
      - ./config.json:/app/config.json:ro
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - lightdb-net

  # LightDB Studio Web
  studio-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: lightdb-studio-web
    command: python -m web.start --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    volumes:
      - studio-config:/home/lightdb/.lightdb_studio
    environment:
      - TZ=Asia/Shanghai
      - LIGHTDB_HOST=lightdb
    depends_on:
      - lightdb
    restart: unless-stopped
    networks:
      - lightdb-net

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: lightdb-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - lightdb-net

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: lightdb-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - lightdb-net

volumes:
  lightdb-data:
  studio-config:
  prometheus-data:
  grafana-data:

networks:
  lightdb-net:
    driver: bridge