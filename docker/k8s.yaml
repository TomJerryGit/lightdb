apiVersion: v1
kind: Namespace
metadata:
  name: lightdb

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lightdb-config
  namespace: lightdb
data:
  config.json: |
    {
      "host": "0.0.0.0",
      "port": 8888,
      "max_connections": 200,
      "buffer_pool_size": 2000
    }

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lightdb-data
  namespace: lightdb
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightdb-server
  namespace: lightdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lightdb-server
  template:
    metadata:
      labels:
        app: lightdb-server
    spec:
      containers:
      - name: server
        # 镜像来自 docker/Dockerfile.v4（含 lightdb/ 与 web/ 源码）
        image: lightdb/server:4.0.0
        # 仓库根目录没有 main.py，必须用模块方式启动（与 entrypoint 一致）
        command: ["python", "-m", "lightdb.main", "--mode", "multi",
                  "--host", "0.0.0.0", "--port", "8888",
                  "--config", "/app/config.json"]
        ports:
        - containerPort: 8888
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: config
          mountPath: /app/config.json
          subPath: config.json
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: lightdb-data
      - name: config
        configMap:
          name: lightdb-config

---
apiVersion: v1
kind: Service
metadata:
  name: lightdb-server
  namespace: lightdb
spec:
  selector:
    app: lightdb-server
  ports:
  - port: 8888
    targetPort: 8888
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightdb-studio-web
  namespace: lightdb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lightdb-studio-web
  template:
    metadata:
      labels:
        app: lightdb-studio-web
    spec:
      containers:
      - name: web
        image: lightdb/server:4.0.0
        command: ["python", "-m", "web.start", "--host", "0.0.0.0",
                  "--port", "8080"]
        ports:
        - containerPort: 8080
        env:
        - name: LIGHTDB_HOST
          value: lightdb-server
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: lightdb-studio-web
  namespace: lightdb
spec:
  selector:
    app: lightdb-studio-web
  ports:
  - port: 80
    targetPort: 8080
  type: LoadBalancer

---
apiVersion: v1
kind: Service
metadata:
  name: lightdb-metrics
  namespace: lightdb
  labels:
    app: lightdb-studio-web
spec:
  selector:
    app: lightdb-studio-web
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080