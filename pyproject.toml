[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lightdb-studio"
dynamic = ["version"]
description = "LightDB - 纯 Python 实现的 MySQL 兼容数据库引擎 + LightDB Studio 图形化管理工具"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "LightDB Team" }]
keywords = ["database", "gui", "navicat", "mysql", "sql", "pyside6"]
classifiers = [
    # 2026-10-19：P0/P1 安全与正确性修复后进入可交付化阶段；仍有已知失败测试与
    # 未完成能力（见 docs/analysis_2026-10-19/06_ROADMAP.md），因此不宣称 Production/Stable。
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Database :: Database Engines/Servers",
]

# 核心依赖：引擎运行期真实需要（psutil/numpy 与 requirements.txt 对齐；
# 之前 pyproject 只声明 pymysql，装出来的包缺 psutil/numpy）。
dependencies = [
    "pymysql>=1.0.0",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5.0",
    "openpyxl>=3.1.0",
]
web = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
]
ssh = [
    "paramiko>=3.0",
]
all = [
    "PySide6>=6.5.0",
    "openpyxl>=3.1.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "httpx>=0.25.0",
    # check_packaging.py 在运行环境直接调 setuptools.build_meta.build_wheel，
    # 这两个是它的运行时依赖（CI 曾因缺 wheel 在 packaging 步骤失败）。
    "setuptools>=61.0",
    "wheel",
    # tests/test_wire_ssl.py 用 cryptography 生成自签证书（不依赖 openssl CLI）。
    "cryptography>=41.0",
]

[project.scripts]
# 引擎服务端入口（README 早就宣称存在，之前 pyproject 里一直没有）
lightdb-server = "lightdb.main:main"
# 桌面端
lightdb-studio = "lightdb_studio.app:run"
# Web 版
lightdb-studio-web = "web.start:main"
# 注意：原 `lightdb-studio-cli = "lightdb_studio.tools.cli:main"` 指向不存在的模块，
# 已删除（引擎侧有 `python -m lightdb.tools.cli` / `lightdb` 命令行客户端）。

[project.urls]
Homepage = "https://github.com/lightdb/studio"
Documentation = "https://github.com/lightdb/studio/docs"
Repository = "https://github.com/lightdb/studio"

[tool.setuptools.dynamic]
# 版本单一来源：lightdb/__init__.py::__version__（当前 4.0.0）
version = { attr = "lightdb.__version__" }

[tool.setuptools.packages.find]
# 之前只打包 lightdb_studio*/web*，wheel 里没有 lightdb 引擎包 —— 装完无法启动服务端。
include = ["lightdb*", "lightdb_studio*", "web*"]
exclude = ["tests*", "benchmarks*", "docs*", "scripts*", "docker*"]

[tool.setuptools.package-data]
lightdb_studio = ["**/*.json", "**/*.qss"]
lightdb = ["cython/*.pyx"]
web = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
