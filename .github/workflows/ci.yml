name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 项目主要在 Windows 上开发（文件锁、socket.share、msvcrt 等路径），
    # 因此 CI 用 windows-latest；Linux 兼容性另有 roadmap 项。
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # GitHub Windows runner 控制台不是 UTF-8（cp1252），测试/注解输出里含中文
      # 会 UnicodeEncodeError（2026-10-21 首跑实测）。强制 Python 以 UTF-8 输出。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install (editable, all extras + dev)
        run: |
          python -m pip install --upgrade pip
          # 运行时显式装 setuptools/wheel：check_packaging.py 在**运行环境**里
          # 调 setuptools.build_meta.build_wheel，CI 的 ensurepip 环境可能
          # 只有 pip（或旧 setuptools），缺 wheel 时 packaging 步骤会 exit 1。
          python -m pip install "setuptools>=61" wheel
          python -m pip install -e ".[all,dev]"

      - name: Compileall
        run: python -m compileall -q lightdb lightdb_studio web

      - name: GUI smoke (offscreen, fail fast)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_gui_smoke_ci.py -q -p no:cacheprovider

      - name: Full test suite (JUnit gate; raw pytest exit logged)
        shell: pwsh
        env:
          # 测试全绿后 Qt/原生库在解释器退出阶段可能 fail-fast（0xC0000409）；
          # conftest 在 pytest 收尾后按 exitstatus os._exit，绕过问题析构路径。
          LIGHTDB_PYTEST_HARD_EXIT: "1"
        run: |
          python -m pytest tests -q -p no:cacheprovider --junitxml=pytest-results.xml
          $raw = $LASTEXITCODE
          Write-Host "pytest raw exit code: $raw"
          python scripts/check_junit.py pytest-results.xml
          $gate = $LASTEXITCODE
          if ($gate -ne 0) { exit $gate }
          if ($raw -ne 0) {
            Write-Host "::warning::pytest exited $raw but JUnit shows 0 failures/errors; gate uses JUnit as the source of truth"
          }

      - name: Annotate failed tests (public check-run annotations)
        if: always()
        run: python scripts/ci_annotate_pytest.py pytest-results.xml

      - name: Upload pytest result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: warn

      - name: Benchmark gate (quick)
        shell: pwsh
        run: |
          python -m benchmarks.run --suite quick --gate > bench.log 2>&1
          $code = $LASTEXITCODE
          Get-Content bench.log -Tail 100
          if ($code -ne 0) {
            Get-Content bench.log -Tail 40 | ForEach-Object { "::error::benchmark: $_" }
            exit $code
          }

      - name: GUI perf budget (hard ceiling; target = WARN only)
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          python scripts/gui_perf_budget.py > gui_perf.log 2>&1
          $code = $LASTEXITCODE
          Get-Content gui_perf.log -Tail 80
          if ($code -ne 0) {
            Get-Content gui_perf.log -Tail 40 | ForEach-Object { "::error::gui-perf: $_" }
            exit $code
          }

      - name: Packaging check (wheel must contain engine + entry points)
        shell: pwsh
        run: |
          python scripts/check_packaging.py > packaging.log 2>&1
          $code = $LASTEXITCODE
          Get-Content packaging.log -Tail 100
          if ($code -ne 0) {
            Get-Content packaging.log -Tail 40 | ForEach-Object { "::error::packaging: $_" }
            exit $code
          }
