name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 项目主要在 Windows 上开发（文件锁、socket.share、msvcrt 等路径），
    # 因此 CI 用 windows-latest；Linux 兼容性另有 roadmap 项。
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (editable, all extras + dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"

      - name: Compileall
        run: python -m compileall -q lightdb lightdb_studio web

      - name: Full test suite
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Benchmark gate (quick)
        run: python -m benchmarks.run --suite quick --gate

      - name: Packaging check (wheel must contain engine + entry points)
        run: python scripts/check_packaging.py
